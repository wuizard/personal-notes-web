<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Notes Maker</title>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #faf9fb;
        --fg: #2e2a33;
        --muted: #6b6472;
        --accent: #6b5fd6;
        --line: #e8e4ee;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141118;
          --fg: #ede9f2;
          --muted: #a79fb4;
          --accent: #9b90f0;
          --line: #302b38;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 400 15px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 34ch;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
      }
      .en {
        padding-top: 14px;
        border-top: 1px solid var(--line);
        width: 100%;
      }
      button {
        margin-top: 6px;
        border: 0;
        border-radius: 12px;
        padding: 9px 18px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="120" height="95" viewBox="0 0 76 60" fill="none" aria-hidden="true">
        <rect
          x="9" y="12" width="40" height="40" rx="7"
          fill="#fff6d1" stroke="var(--line)" stroke-width="1.5"
          transform="rotate(-7 29 32)"
        />
        <rect
          x="26" y="8" width="40" height="40" rx="7"
          fill="#d9f2ea" stroke="var(--line)" stroke-width="1.5"
          transform="rotate(6 46 28)"
        />
        <path
          d="M36 22h18M36 29h14M36 36h9"
          stroke="var(--muted)" stroke-width="2" stroke-linecap="round" opacity=".5"
        />
      </svg>

      <h1>Anda sedang offline</h1>
      <p>
        Halaman ini belum tersimpan di perangkat Anda. Catatan yang sudah ada tetap
        bisa dibuka.
      </p>

      <div class="en">
        <h1>You're offline</h1>
        <p>This page hasn't been saved to your device yet. Notes you already have still open.</p>
      </div>

      <button type="button" onclick="location.reload()">Coba lagi · Retry</button>
    </main>
  </body>
</html>
