# Production Mongo for notes-maker-api, VPS-side.
#
# Differs from the repo-root docker-compose.yml (local dev) in the ways that
# matter once this is reachable from the internet:
#   - --auth + --keyFile: client AND internal replica-set auth are required.
#     A single-node replica set still needs the keyfile even with one member.
#   - Port is published to 127.0.0.1 only. The Go API runs on the same VPS
#     (systemd, not a container) and reaches Mongo over loopback; nothing
#     external ever needs to see 27017.
#   - No mongo-express. That's a dev convenience with no auth of its own —
#     do not run it here.
#
# One-time setup: see init-replica-and-user.sh in this directory before the
# API can actually authenticate.
#
# Named explicitly (rather than defaulting to the containing directory's
# basename, "deploy") so `docker compose ps`/volume names stay meaningful
# regardless of which directory this is invoked from.
name: notes-maker-api
services:
  mongo:
    image: mongo:7
    container_name: notes-maker-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--auth", "--keyFile", "/etc/mongo-keyfile"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      # Absolute path, deliberately — Compose resolves a RELATIVE bind-mount
      # source against the compose file's own directory, not the caller's
      # cwd. A relative `./mongo-keyfile` here silently mounted a
      # Compose-vivified placeholder at deploy/mongo-keyfile instead of the
      # real, correctly-permissioned file at /opt/notes-maker-api/ — mongod
      # then refused to start ("permissions ... are too open") against that
      # placeholder. Generate the real file with:
      #   openssl rand -base64 756 > /opt/notes-maker-api/mongo-keyfile
      #   chmod 400 /opt/notes-maker-api/mongo-keyfile
      #   sudo chown 999:999 /opt/notes-maker-api/mongo-keyfile
      # Never commit this file — see .gitignore in this directory.
      - /opt/notes-maker-api/mongo-keyfile:/etc/mongo-keyfile:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
