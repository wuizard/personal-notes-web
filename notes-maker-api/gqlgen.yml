schema:
  - internal/graph/schema.graphql

exec:
  filename: internal/graph/generated/generated.go
  package: generated

model:
  filename: internal/graph/model/models_gen.go
  package: model

resolver:
  layout: single-file
  filename: internal/graph/resolver.go
  package: graph

omit_slice_element_pointers: true
omit_getters: true

models:
  # Bind the schema's DateTime scalar to time.Time rather than leaving it as
  # an untyped `any` the resolvers would have to cast on every field.
  DateTime:
    model: github.com/99designs/gqlgen/graphql.Time
